name: Deploy to Hostinger

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Hostinger via SSH (rsync)
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
        run: |
          rsync -avz -e "ssh -p 65002 -i ~/.ssh/id_ed25519" ./out/ "$SSH_USER@$SSH_HOST:domains/petplancompare.com/public_html/"
